<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BebixTV — En Directo</title>
<style>
  :root{
    --bg:#0b1220;
    --panel:#111a2e;
    --panel-2:#182338;
    --accent:#2f80ff;
    --accent-2:#1f5fd0;
    --text:#e6ecf5;
    --muted:#8b9bb4;
    --border:#22314d;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',Roboto,system-ui,sans-serif;
    background:var(--bg);color:var(--text);
    height:100vh;overflow:hidden;
  }
  .app{display:grid;grid-template-columns:320px 1fr;height:100vh;}
  /* SIDEBAR */
  .sidebar{
    background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .logo{
    padding:18px 20px;font-size:22px;font-weight:800;
    letter-spacing:.5px;
    background:linear-gradient(90deg,#2f80ff,#7db2ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    border-bottom:1px solid var(--border);
  }
  .logo span{color:var(--text);-webkit-text-fill-color:var(--text);}
  .filters{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border);}
  .filters input,.filters select{
    background:var(--panel-2);border:1px solid var(--border);
    border-radius:8px;color:var(--text);padding:10px 12px;
    font-size:14px;outline:none;
  }
  .filters input:focus,.filters select:focus{border-color:var(--accent);}
  .channels{flex:1;overflow-y:auto;padding:8px;}
  .channels::-webkit-scrollbar{width:6px;}
  .channels::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  .card{
    display:flex;align-items:center;gap:12px;
    padding:10px;border-radius:10px;cursor:pointer;
    margin-bottom:6px;border:1px solid transparent;transition:.15s;
  }
  .card:hover{background:var(--panel-2);}
  .card.active{background:var(--panel-2);border-color:var(--accent);}
  .card img{
    width:44px;height:44px;object-fit:contain;border-radius:8px;
    background:#0d1526;padding:4px;
  }
  .card .info{overflow:hidden;}
  .card .info h4{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .info span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}
  /* PLAYER */
  .player-area{display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0%,#101b30,#070d18);}
  .video-wrap{
    flex:1;position:relative;display:flex;align-items:center;justify-content:center;
    background:#000;overflow:hidden;
  }
  video{width:100%;height:100%;object-fit:contain;background:#000;}
  .placeholder{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:var(--muted);
    gap:10px;pointer-events:none;
  }
  .placeholder .big{font-size:60px;opacity:.25;}
  .now-playing{
    display:flex;align-items:center;gap:16px;padding:14px 22px;
    background:var(--panel);border-top:1px solid var(--border);
  }
  .now-playing img{width:52px;height:52px;object-fit:contain;background:#0d1526;border-radius:10px;padding:6px;}
  .now-playing .np-info h2{font-size:17px;}
  .now-playing .np-info span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;}
  .np-actions{margin-left:auto;display:flex;gap:8px;}
  .np-actions button{
    background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:10px 16px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s;
  }
  .np-actions button:hover{background:var(--accent-2);}
  .np-actions button.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .np-actions button.ghost:hover{background:var(--panel-2);}
  @media(max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;}
    .sidebar{max-height:38vh;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">Bebix<span>TV</span></div>
    <div class="filters">
      <input type="text" id="search" placeholder="🔍 Buscar canal..." />
      <select id="filterGroup">
        <option value="">Todos los grupos</option>
      </select>
    </div>
    <div class="channels" id="channelsList"></div>
  </aside>

  <main class="player-area">
    <div class="video-wrap">
      <video id="video" controls autoplay playsinline></video>
      <div class="placeholder" id="placeholder">
        <div class="big">📺</div>
        <p>Selecciona un canal para empezar</p>
      </div>
    </div>
    <div class="now-playing">
      <img id="nowLogo" src="" alt="" />
      <div class="np-info">
        <h2 id="nowName">—</h2>
        <span id="nowGroup"></span>
      </div>
      <div class="np-actions">
        <button id="reloadBtn" class="ghost">🔄 Recargar</button>
        <button id="fullscreenBtn">⛶ Pantalla completa</button>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $("video");
  const placeholder = $("placeholder");
  const listEl = $("channelsList");
  const searchEl = $("search");
  const groupEl = $("filterGroup");
  const nowLogo = $("nowLogo");
  const nowName = $("nowName");
  const nowGroup = $("nowGroup");

  let allChannels = [];
  let currentChannel = null;
  let hls = null;

  // Cargar canales (respeta edición local desde el admin vía localStorage)
  async function loadChannels() {
    try {
      const res = await fetch("channels.json", { cache: "no-store" });
      allChannels = await res.json();
    } catch (e) {
      console.error("Error cargando channels.json", e);
      allChannels = [];
    }
    const local = localStorage.getItem("bebixtv_channels");
    if (local) {
      try { allChannels = JSON.parse(local); } catch {}
    }
    allChannels = allChannels.filter(c => c.active !== false);
    populateGroups();
    renderChannels();
  }

  function populateGroups() {
    const groups = [...new Set(allChannels.map(c => c.group))].sort();
    groupEl.innerHTML = '<option value="">Todos los grupos</option>' +
      groups.map(g => `<option value="${g}">${g}</option>`).join("");
  }

  function renderChannels() {
    const term = searchEl.value.trim().toLowerCase();
    const grp = groupEl.value;
    const filtered = allChannels.filter(c =>
      (!grp || c.group === grp) &&
      (!term || c.name.toLowerCase().includes(term))
    );

    if (!filtered.length) {
      listEl.innerHTML = '<p style="color:#8b9bb4;padding:20px;text-align:center;">Sin resultados</p>';
      return;
    }
    listEl.innerHTML = filtered.map(c => `
      <div class="card ${currentChannel && currentChannel.id === c.id ? 'active' : ''}" data-id="${c.id}">
        <img src="${c.logo}" alt="${c.name}" onerror="this.style.visibility='hidden'">
        <div class="info">
          <h4>${c.name}</h4>
          <span>${c.group}</span>
        </div>
      </div>
    `).join("");

    listEl.querySelectorAll(".card").forEach(card => {
      card.addEventListener("click", () => {
        const ch = allChannels.find(x => x.id === Number(card.dataset.id));
        if (ch) playChannel(ch);
      });
    });
  }

  function playChannel(channel) {
    currentChannel = channel;
    placeholder.style.display = "none";
    nowLogo.src = channel.logo;
    nowName.textContent = channel.name;
    nowGroup.textContent = channel.group;
    renderChannels();

    if (hls) { hls.destroy(); hls = null; }

    if (Hls.isSupported()) {
      hls = new Hls({ lowLatencyMode: true, enableWorker: true });
      hls.loadSource(channel.url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(() => {});
      });
      hls.on(Hls.Events.ERROR, (_, data) => {
        console.warn("HLS error:", data);
        if (data.fatal) {
          placeholder.style.display = "flex";
          placeholder.querySelector("p").textContent =
            "⚠️ No se pudo cargar el canal. Prueba otro o recarga.";
        }
      });
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = channel.url;
      video.addEventListener("loadedmetadata", () => video.play().catch(() => {}), { once: true });
    } else {
      alert("Tu navegador no soporta HLS.");
    }
  }

  searchEl.addEventListener("input", renderChannels);
  groupEl.addEventListener("change", renderChannels);

  $("reloadBtn").addEventListener("click", () => {
    if (currentChannel) playChannel(currentChannel);
  });

  $("fullscreenBtn").addEventListener("click", () => {
    const wrap = video.parentElement;
    if (!document.fullscreenElement) {
      (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
    } else {
      document.exitFullscreen();
    }
  });

  loadChannels();
})();
</script>
</body>
</html>
